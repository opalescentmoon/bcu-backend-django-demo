        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoodWrite'
          description: ''
    delete:
      operationId: foods_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this produk makanan.
        required: true
      tags:
      - makanan
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/foods/{id}/variants/:
    post:
      operationId: foods_variants_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this produk makanan.
        required: true
      tags:
      - makanan
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FoodVariantRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FoodVariantRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/FoodVariantRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoodDetail'
          description: ''
  /api/foods/{id}/variants/{variant_id}/:
    patch:
      operationId: foods_variants_partial_update
      description: PATCH/DELETE /api/foods/{id}/variants/{variant_id}/
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: path
        name: variant_id
        schema:
          type: integer
        required: true
      tags:
      - makanan
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedFoodVariantRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedFoodVariantRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedFoodVariantRequest'
      security:
      - jwtAuth: []
