      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: path
        name: variant_id
        schema:
          type: integer
        required: true
      tags:
      - makanan
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/health/:
    get:
      operationId: health_retrieve
      tags:
      - utilitas
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
