      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - keranjang
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/categories/:
    get:
      operationId: categories_list
      parameters:
      - in: query
        name: type
        schema:
          type: string
          enum:
          - food
          - image
      tags:
      - katalog
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
          description: ''
  /api/downloads/:
    get:
      operationId: downloads_list
      description: GET /api/downloads/ — aset gambar yang sudah dibeli.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - gambar
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedImagePurchaseList'
          description: ''
  /api/foods/:
    get:
      operationId: foods_list
      parameters:
      - in: query
        name: category
        schema:
          type: string
      - in: query
        name: city
        schema:
          type: string
      - in: query
        name: max_price
        schema:
          type: number
      - in: query
        name: min_price
        schema:
          type: number
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
      - in: query
        name: vendor
        schema:
          type: string
      tags:
      - makanan
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedFoodListList'
          description: ''
    post:
      operationId: foods_create
      tags:
      - makanan
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FoodWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FoodWriteRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/FoodWriteRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoodWrite'
          description: ''
  /api/foods/{id}/:
    get:
      operationId: foods_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this produk makanan.
        required: true
      tags:
      - makanan
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoodDetail'
          description: ''
    patch:
      operationId: foods_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this produk makanan.
        required: true
      tags:
      - makanan
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedFoodWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedFoodWriteRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedFoodWriteRequest'
