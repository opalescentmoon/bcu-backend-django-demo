          description: No response body
  /api/cart/items/:
    post:
      operationId: cart_items_create
      tags:
      - keranjang
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartItemCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CartItemCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CartItemCreateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/cart/items/{id}/:
    patch:
      operationId: cart_items_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - keranjang
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCartItemUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCartItemUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCartItemUpdateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
