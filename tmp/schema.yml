                additionalProperties: {}
          description: ''
  /api/images/:
    get:
      operationId: images_list
      parameters:
      - in: query
        name: category
        schema:
          type: string
      - in: query
        name: license
        schema:
          type: string
          enum:
          - commercial
          - personal
        description: |-
          * `personal` - Personal
          * `commercial` - Komersial
      - in: query
        name: max_price
        schema:
          type: number
      - in: query
        name: min_price
        schema:
          type: number
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - in: query
        name: orientation
        schema:
          type: string
          enum:
          - landscape
          - portrait
          - square
        description: |-
          * `landscape` - Landscape
          * `portrait` - Portrait
          * `square` - Square
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
      - in: query
        name: vendor
        schema:
          type: string
      tags:
      - gambar
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedImageListList'
          description: ''
